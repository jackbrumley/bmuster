<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#f4f7f2" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#0f1411" media="(prefers-color-scheme: dark)" />
		<meta name="text-scale" content="scale" />
		<script>
			// Apply the saved theme before first paint (see src/lib/ui/theme-switch.svelte).
			try {
				const theme = localStorage.getItem('bmuster-theme');
				if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
			} catch {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
