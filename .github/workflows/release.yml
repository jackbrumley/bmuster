# Builds the BMuster server release archives and, for a tag, publishes them
# (docs/specs/SPEC-SERVER-INSTALL.md, I13).
#
#   Tag push (vX.Y.Z, equal to package.json's version): builds the agents and
#     launchers on each platform, then the three archives on native runners,
#     writes SHA256SUMS, install-tests the Linux and Windows archives with the
#     installers from this commit, and only then creates the GitHub release
#     with all four files at once, so the installers' "latest" never sees a
#     half-filled release.
#   Manual run (Actions tab, or `gh workflow run release.yml --ref <branch>`):
#     a dry run of everything but the release; the files stay as workflow
#     artifacts.
#   The `image` job (last in this file) builds the container image from the
#     Linux archives and, for a tag, pushes it to GHCR.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Pinned so a release is reproducible; Linux binaries link against glibc 2.31.
  ZIGLANG_VERSION: '0.17.1'
  CARGO_ZIGBUILD_VERSION: '0.24.1'
  GLIBC_FLOOR: '2.31'

jobs:
  check:
    name: Check the version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Tag matches package.json
        if: github.event_name == 'push'
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $expected. Bump package.json, commit, then tag."
            exit 1
          fi

  binaries:
    name: Agent and launcher (${{ matrix.target }})
    needs: check
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust if missing
        run: |
          if ! command -v rustup > /dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi

      - name: Add the Rust target
        run: rustup target add "${{ matrix.target }}"

      # The runner's own glibc is newer than Debian 11, Ubuntu 22.04 or
      # Raspberry Pi OS; zig links against an older one instead.
      - name: Install zig and cargo-zigbuild (Linux)
        if: runner.os == 'Linux'
        run: |
          python3 -m pip install --target "$RUNNER_TEMP/zig" "ziglang==$ZIGLANG_VERSION" "cargo-zigbuild==$CARGO_ZIGBUILD_VERSION"
          echo "$RUNNER_TEMP/zig/bin" >> "$GITHUB_PATH"
          echo "PYTHONPATH=$RUNNER_TEMP/zig" >> "$GITHUB_ENV"

      - name: Build (Linux, glibc ${{ env.GLIBC_FLOOR }})
        if: runner.os == 'Linux'
        working-directory: agent
        run: cargo-zigbuild zigbuild --release --target "${{ matrix.target }}.$GLIBC_FLOOR" -p bmuster-agent -p bmuster-server

      - name: Build (Windows)
        if: runner.os == 'Windows'
        working-directory: agent
        run: cargo build --release --target "${{ matrix.target }}" -p bmuster-agent -p bmuster-server

      - name: Collect
        run: |
          ext=""
          if [ "$RUNNER_OS" = "Windows" ]; then ext=".exe"; fi
          mkdir -p "binaries/${{ matrix.target }}"
          for name in bmuster-agent bmuster-server; do
            cp "agent/target/${{ matrix.target }}/release/${name}${ext}" "binaries/${{ matrix.target }}/"
          done

      - name: Check the glibc floor (Linux)
        if: runner.os == 'Linux'
        run: |
          for file in binaries/${{ matrix.target }}/*; do
            newest="$(objdump -T "$file" | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -uV | tail -n 1)"
            echo "$file needs glibc $newest"
            highest="$(printf '%s\n%s\n' "$newest" "$GLIBC_FLOOR" | sort -V | tail -n 1)"
            if [ "$highest" != "$GLIBC_FLOOR" ]; then
              echo "::error::$file needs glibc $newest, above the $GLIBC_FLOOR floor"
              exit 1
            fi
          done

      # Release signature for automatic agent updates (SPEC-AGENT-UPDATES).
      # After the glibc check, so its objdump loop never meets the .sig file.
      # Without the secret (a fork, or before it is set) the build stays
      # unsigned: it installs, but agents will not take it as an update.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Sign the agent
        env:
          BMUSTER_RELEASE_SIGNING_KEY: ${{ secrets.BMUSTER_RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$BMUSTER_RELEASE_SIGNING_KEY" ]; then
            echo "::warning::BMUSTER_RELEASE_SIGNING_KEY is not set; the agent is not signed"
            exit 0
          fi
          ext=""
          if [ "$RUNNER_OS" = "Windows" ]; then ext=".exe"; fi
          node scripts/agent-sign.ts --target "${{ matrix.target }}" "binaries/${{ matrix.target }}/bmuster-agent${ext}"

      - uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.target }}
          path: binaries/
          retention-days: 7

  package:
    name: Archive (${{ matrix.platform }})
    needs: binaries
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
          - runner: windows-latest
            platform: windows-x64
    # Native runners: node_modules holds native modules for its platform.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      # The prepare script is POSIX shell, which Windows npm cannot run; the
      # build syncs SvelteKit itself.
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - uses: actions/download-artifact@v8
        with:
          pattern: binaries-*
          path: dist/binaries
          merge-multiple: true

      - name: Build the archive
        run: node scripts/release-server.ts --binaries dist/binaries

      - uses: actions/upload-artifact@v7
        with:
          name: archive-${{ matrix.platform }}
          path: dist/release/bmuster-server-${{ matrix.platform }}.*
          retention-days: 7

  sums:
    name: Checksums
    needs: package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: archive-*
          path: release
          merge-multiple: true

      - name: Write SHA256SUMS
        working-directory: release
        run: |
          sha256sum bmuster-server-* > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: release/
          retention-days: 14

  # Installs, upgrades and removes the archives as users will, with the
  # installers from this commit (the ones bmuster.com serves once merged).
  install-test-linux:
    name: Install test (Linux)
    needs: sums
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: release
          path: release

      - name: Install
        run: sudo sh docs/install.sh --archive release/bmuster-server-linux-x64.tar.gz

      - name: Ready, with a setup code in the log
        run: |
          curl -fsk https://127.0.0.1:8443/readyz
          curl -fsk https://127.0.0.1:8443/healthz
          sudo journalctl -u bmuster-server -o cat --no-pager | grep -q 'first-run setup code:'
          test "$(stat -c %U /var/lib/bmuster-server)" = "bmuster-server"

      - name: Upgrade keeps the data
        run: |
          key="$(sudo grep '^SECRETS_KEY=' /var/lib/bmuster-server/server.env)"
          sudo sh docs/install.sh --archive release/bmuster-server-linux-x64.tar.gz
          test "$(sudo grep '^SECRETS_KEY=' /var/lib/bmuster-server/server.env)" = "$key"
          sudo test -f /var/lib/bmuster-server/bmuster.db

      - name: Uninstall
        run: |
          sudo /opt/bmuster-server/bmuster-server uninstall --purge
          test ! -e /opt/bmuster-server
          test ! -e /var/lib/bmuster-server
          test ! -e /etc/systemd/system/bmuster-server.service
          ! id bmuster-server

  install-test-windows:
    name: Install test (Windows)
    needs: sums
    runs-on: windows-latest
    defaults:
      run:
        # Windows PowerShell 5.1, the one `irm | iex` users have.
        shell: powershell
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: release
          path: release

      - name: Install
        run: '& .\docs\install.ps1 -Archive release\bmuster-server-windows-x64.zip'

      - name: Ready
        run: |
          curl.exe -fsk https://127.0.0.1:8443/readyz
          if ($LASTEXITCODE -ne 0) { throw 'not ready' }
          if ((Get-Service BMusterServer).Status -ne 'Running') { throw 'service not running' }

      - name: Upgrade keeps the data
        run: |
          $key = Select-String '^SECRETS_KEY=' 'C:\ProgramData\BMuster Server\server.env'
          & .\docs\install.ps1 -Archive release\bmuster-server-windows-x64.zip
          $again = Select-String '^SECRETS_KEY=' 'C:\ProgramData\BMuster Server\server.env'
          if ($key.Line -ne $again.Line) { throw 'the secrets key changed' }

      - name: Uninstall
        run: |
          & 'C:\Program Files\BMuster Server\bmuster-server.exe' uninstall --purge
          if ($LASTEXITCODE -ne 0) { throw 'uninstall failed' }
          Start-Sleep -Seconds 8
          if (Get-Service BMusterServer -ErrorAction SilentlyContinue) { throw 'service still there' }
          if (Test-Path 'C:\Program Files\BMuster Server') { throw 'program folder still there' }
          if (Test-Path 'C:\ProgramData\BMuster Server') { throw 'data folder still there' }

  publish:
    name: Publish the release
    needs: [install-test-linux, install-test-windows]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: release

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --verify-tag \
            --title "BMuster $GITHUB_REF_NAME" \
            --generate-notes

  # The container image (docs/specs/SPEC-HOSTING.md H4, docs/hosting.md),
  # built from the two Linux archives the install tests just passed, so the
  # image runs exactly what they hold. The Dockerfile runs nothing on the
  # target architecture, so both images build on one runner without QEMU.
  # Tag push: pushed to GHCR as vX.Y.Z, X.Y and latest. Manual run: built
  # and smoke-tested, never pushed. Self-contained: it changes no other job.
  image:
    name: Container image
    needs: [install-test-linux, install-test-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/jackbrumley/bmuster
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release

      - name: Unpack the Linux archives
        run: |
          (cd release && sha256sum --check --ignore-missing SHA256SUMS)
          mkdir -p image/amd64 image/arm64
          tar -xzf release/bmuster-server-linux-x64.tar.gz -C image/amd64
          tar -xzf release/bmuster-server-linux-arm64.tar.gz -C image/arm64
          echo "BMUSTER_VERSION=$(cat image/amd64/bmuster-server/VERSION)" >> "$GITHUB_ENV"
          echo "NODE_VERSION=$(cat .node-version)" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build for the smoke test (amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: image
          file: docker/app/Dockerfile
          platforms: linux/amd64
          build-args: |
            NODE_VERSION=${{ env.NODE_VERSION }}
            BMUSTER_VERSION=${{ env.BMUSTER_VERSION }}
          load: true
          push: false
          tags: bmuster:smoke

      - name: Smoke test (healthy, setup code, agent download)
        run: |
          docker run -d --name smoke -p 127.0.0.1:8080:8080 \
            -e SECRETS_KEY="$(openssl rand -base64 32)" \
            bmuster:smoke
          for _ in $(seq 1 40); do
            status="$(docker inspect --format '{{.State.Health.Status}}' smoke)"
            if [ "$status" = "healthy" ]; then break; fi
            sleep 3
          done
          docker logs smoke > smoke.log 2>&1
          cat smoke.log
          test "$(docker inspect --format '{{.State.Health.Status}}' smoke)" = "healthy"
          curl -fsS http://127.0.0.1:8080/readyz
          grep -q 'first-run setup code:' smoke.log
          docker exec smoke test -x "/opt/bmuster/releases/$BMUSTER_VERSION/aarch64-unknown-linux-gnu/bmuster-agent"
          docker rm -f smoke

      - name: Image names
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # latest only for a release version (not a pre-release such as v1.2.0-rc.1).
          flavor: latest=auto
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Sign in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (amd64 and arm64), and push for a tag
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: image
          file: docker/app/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            NODE_VERSION=${{ env.NODE_VERSION }}
            BMUSTER_VERSION=${{ env.BMUSTER_VERSION }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
