[workspace]
resolver = "2"
members = ["crates/protocol", "crates/service", "crates/agent", "crates/server", "crates/desktop"]

[workspace.package]
version = "0.4.1"
edition = "2021"
license = "AGPL-3.0-only"
publish = false
rust-version = "1.89"

[workspace.dependencies]
bmuster-protocol = { path = "crates/protocol" }
bmuster-service = { path = "crates/service" }
bmuster-desktop = { path = "crates/desktop" }
anyhow = "=1.0.104"
base64 = "=0.22.1"
clap = { version = "=4.6.7", features = ["derive", "env"] }
ed25519-dalek = "=2.2.0"
getrandom = { version = "=0.2.17", features = ["std"] }
hex = "=0.4.3"
libc = "=0.2.191"
httpdate = "=1.0.3"
log = { version = "=0.4.35", features = ["std"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
windows-service = "=0.8.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"
panic = "abort"

# The desktop encoder runs per frame: optimise it for speed, not size.
[profile.release.package.bmuster-desktop]
opt-level = 3

[profile.release.package.jpeg-encoder]
opt-level = 3
