[package]
name = "bmuster-server"
description = "BMuster server launcher: runs the bundled Node server and installs it as a service"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[[bin]]
name = "bmuster-server"
path = "src/main.rs"

[dependencies]
bmuster-service.workspace = true
anyhow.workspace = true
base64.workspace = true
clap.workspace = true
getrandom.workspace = true
serde.workspace = true
serde_json.workspace = true
ed25519-dalek.workspace = true
sha2.workspace = true
hex.workspace = true
semver = "=1.0.28"
flate2 = "=1.1.11"
tar = "=0.4.46"
ureq = { version = "=3.5.1", default-features = false, features = ["rustls", "platform-verifier"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-service.workspace = true
windows-sys = { version = "=0.61.2", features = ["Win32_Storage_FileSystem"] }
