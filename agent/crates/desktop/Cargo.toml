[package]
name = "bmuster-desktop"
description = "BMuster remote desktop: screen capture, input injection and the tile encoder (SPEC-DESKTOP)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
log.workspace = true
serde.workspace = true
serde_json.workspace = true
# JPEG tiles (SPEC-DESKTOP 4.4). Licence: (MIT OR Apache-2.0) AND IJG; see NOTICE.md.
jpeg-encoder = { version = "=0.7.1", default-features = false, features = ["std", "simd"] }
# Cursor shapes are sent as PNG (SPEC-DESKTOP 4.2).


[target.'cfg(target_os = "linux")'.dependencies]
libc = "=0.2.191"
x11rb = { version = "=0.13.2", default-features = false, features = ["shm", "damage", "xfixes", "randr", "xtest"] }

[target.'cfg(windows)'.dependencies]
# The clipboard for copy and paste (SPEC-DESKTOP 21.4); already in the build through the agent's tray.
arboard = { version = "=3.7.0", default-features = false }
windows = { version = "=0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_IO",
  "Win32_System_JobObjects",
  "Win32_System_LibraryLoader",
  "Win32_System_Pipes",
  "Win32_System_RemoteDesktop",
  "Win32_System_StationsAndDesktops",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "=3.27.0"
# Decodes encoded tiles in tests to check the pixels survived.
zune-jpeg = "=0.5.15"
# Decodes cursor PNGs in tests to check the hand-written encoder.
png = "=0.18.1"

[[bench]]
name = "tiles"
harness = false
