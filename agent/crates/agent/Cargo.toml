[package]
name = "bmuster-agent"
description = "BMuster agent: enrols a machine with a BMuster server, checks in and keeps a live socket open"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[[bin]]
name = "bmuster-agent"
path = "src/main.rs"

[dependencies]
bmuster-protocol.workspace = true
bmuster-service.workspace = true
anyhow.workspace = true
base64.workspace = true
clap.workspace = true
ed25519-dalek.workspace = true
getrandom.workspace = true
hex.workspace = true
httpdate.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
# HTTP request parsing for the local page (already in the build through tungstenite).
httparse = "=1.10.1"
# The local page's self-signed certificate (ECDSA P-256).
rcgen = { version = "=0.13.2", default-features = false, features = ["ring"] }
# HMAC-SHA1 for the local page's sign-in codes (RFC 6238); already in the build through rustls.
ring = "=0.17.14"
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "=0.7.1"
# Already in the build through rustls; used directly to read a certificate's public key for pinning.
webpki = { package = "rustls-webpki", version = "=0.103.16", default-features = false, features = ["alloc"] }
sysinfo = { version = "=0.38.4", default-features = false, features = ["system", "disk", "network"] }
tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake", "rustls-tls-native-roots"] }
ureq = { version = "=3.5.1", default-features = false, features = ["rustls-no-provider", "platform-verifier", "win-system-proxy"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-service.workspace = true
# Graphics cards (SPEC-MACHINE-DETAILS D8): Win32_VideoController over COM, no child process.
wmi = { version = "=0.18.4", default-features = false }
# Video memory over 4 GB, which Win32_VideoController's 32-bit AdapterRAM cannot hold.
windows-registry = "=0.6.1"
# Terminal sessions: ConPTY, pipes, processes and Job Objects; Files: drives and free space (already in the build through other crates).
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Threading"] }

[build-dependencies]
base64.workspace = true
bmuster-protocol.workspace = true

[dev-dependencies]
tempfile = "=3.27.0"
