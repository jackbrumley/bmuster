<svg class="hero-art" viewBox="0 0 420 340" aria-hidden="true" focusable="false">
  <!-- BMuster's version of the family hero art (the layout and gradients of
       Rusty G6 / SomeDrive / Voquill): a fleet of three screens, big, medium
       and small, with a radar ping spreading out from the medium one. -->
  <defs>
    <linearGradient id="bm-big" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.05" />
      <stop offset="1" stop-color="#65a30d" stop-opacity="0.5" />
    </linearGradient>
    <!-- Strongest at the top right, where it sits in front of the big screen. -->
    <linearGradient id="bm-mid" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a3e635" stop-opacity="0.85" />
      <stop offset="1" stop-color="#65a30d" stop-opacity="0.12" />
    </linearGradient>
    <linearGradient id="bm-small" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.75" />
      <stop offset="1" stop-color="#34d399" stop-opacity="0.06" />
    </linearGradient>
  </defs>
  <!-- Back to front: the big screen, the small screen, the medium screen. -->
  <rect x="140" y="56" width="250" height="168" rx="22" fill="url(#bm-big)" />
  <rect x="318" y="20" width="92" height="62" rx="14" fill="url(#bm-small)" />
  <rect x="56" y="176" width="168" height="112" rx="18" fill="url(#bm-mid)" />
  <!-- The ping: two arcs around the medium screen's top-right corner. -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1.5" stroke-linecap="round">
    <path d="M224 116 A60 60 0 0 1 284 176" />
    <path d="M224 76 A100 100 0 0 1 324 176" />
  </g>
</svg>
